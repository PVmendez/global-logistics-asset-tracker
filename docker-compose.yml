services:
  sqlserver:
    image: "mcr.microsoft.com/mssql/server:2022-latest"
    container_name: glat-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "P@ssw0rd123!"
      MSSQL_TCP_PORT: 1433
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - glat-network

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: glat-api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5000
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=glatdb;User Id=sa;Password=P@ssw0rd123!;Encrypt=False;"
      Jwt__Secret: "your-super-secret-key-change-in-production-environment-with-at-least-32-characters"
      Jwt__Issuer: "glat-api"
      Jwt__Audience: "glat-clients"
    ports:
      - "5000:5000"
    depends_on:
      - sqlserver
    networks:
      - glat-network
    volumes:
      - ./logs:/app/logs

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: glat-web
    ports:
      - "3000:3000"
    depends_on:
      - api
    environment:
      VITE_API_BASE_URL: "http://api:5000/api/v1"
    networks:
      - glat-network

volumes:
  sqlserver_data:

networks:
  glat-network:
    driver: bridge

